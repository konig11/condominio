{% extends 'base_admin.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Lista de Moradores</h2>
    <a href="{% url 'criar_morador' %}" class="btn btn-primary mb-3">Adicionar Morador</a>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Casa</th>
                <th>Usuário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for morador in moradores %}
            <tr>
                <td>{{ morador.nome }}</td>
                <td>{{ morador.telefone }}</td>
                <td>{{ morador.nr_casa }}</td>
                <td>{{ morador.usuario.username }}</td>
                <td>
                    <a href="{% url 'editar_morador' morador.id %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'excluir_morador' morador.id %}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja excluir este morador?')">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
