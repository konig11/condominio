{% extends 'base_morador.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Painel do Morador</h2>
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">📅 Reservas das Áreas Sociais</div>
                <div class="card-body text-center">
                    <p>Gerencie suas reservas de áreas sociais do condomínio.</p>
                    <a href="{% url 'menu_reservas' %}" class="btn btn-primary">Acessar Reservas</a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">💰 Situação Financeira</div>
                <div class="card-body text-center">
                    <p>Veja seu saldo e pagamentos no condomínio.</p>
                    <a href="{% url 'saldo_condominio' %}" class="btn btn-success">Ver Finanças</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
