{% extends "base_porteiro.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Registrar Visita no Momento</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Registrar Entrada</button>
        <a href="{% url 'lista_visitas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
